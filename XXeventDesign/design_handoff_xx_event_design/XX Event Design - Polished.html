<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XX Event Design — Polished Prototype</title>
<meta name="ext-resource-dependency" content="assets/logo.jpg" data-resource-id="logoImg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="directionA-polished.jsx"></script>

<script type="text/babel">
function App() {
  const [device, setDevice] = React.useState('mobile');

  return (
    <div style={{ minHeight: '100vh' }}>
      {/* Device toggle — bottom bar, out of the way of the site's own nav */}
      <div style={{
        position: 'fixed', bottom: 16, left: '50%', transform: 'translateX(-50%)', zIndex: 999,
        display: 'flex', gap: 8, padding: 12, background: 'rgba(255,253,248,0.95)',
        border: '1px solid rgba(34,18,8,0.14)', borderRadius: 8, backdropFilter: 'blur(8px)',
        fontFamily: '"Inter", system-ui, sans-serif', fontSize: 12, letterSpacing: '0.1em',
      }}>
        {['desktop', 'tablet', 'mobile'].map(d => (
          <button key={d} onClick={() => setDevice(d)} style={{
            padding: '8px 14px', background: device === d ? '#221208' : 'transparent',
            color: device === d ? '#FFFDF8' : '#221208', border: `1px solid ${device === d ? '#221208' : 'rgba(34,18,8,0.2)'}`,
            borderRadius: 4, cursor: 'pointer', textTransform: 'capitalize', transition: 'all 0.2s ease',
          }}>
            {d === 'desktop' && '🖥️ Desktop'}
            {d === 'tablet' && '📱 Tablet'}
            {d === 'mobile' && '📱 Mobile'}
          </button>
        ))}
      </div>

      {/* Main content — scoped to device width */}
      <div style={{
        maxWidth: device === 'desktop' ? 1280 : device === 'tablet' ? 820 : 390,
        margin: '0 auto', background: '#FBF7F0',
      }}>
        {device === 'desktop' || device === 'tablet' || device === 'mobile' ? (
          <>
            <HomeAPolished device={device} />
            <ServicesAPolished device={device} />
            <GalleryAPolished device={device} />
            <ContactAPolished device={device} />
          </>
        ) : null}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
